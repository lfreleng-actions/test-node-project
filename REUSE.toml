version = 1

# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Licensing statement required for linting to pass for this repository

[[annotations]]
path = [
     "app/**",
     "package-lock.json",
     "package.json"
]
SPDX-License-Identifier = "Apache-2.0"
SPDX-FileCopyrightText = "2025 The Linux Foundation"

# Package-manager variants: JSON manifests allow no comments, and the
# lockfiles are generated, so neither can carry an inline header
[[annotations]]
path = [
     "variants/**/package.json",
     "variants/**/bun.lock",
     "variants/**/pnpm-lock.yaml",
     "variants/**/yarn.lock"
]
SPDX-License-Identifier = "Apache-2.0"
SPDX-FileCopyrightText = "2026 The Linux Foundation"
