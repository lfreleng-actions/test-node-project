# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths:
      - '**'
      - '!.github/**'
      - '!.*'
      - '!tox.ini'
      # Root dotfiles that change the outcome of the format check
      - '.editorconfig'
      - '.prettierignore'
      - '.prettierrc.yaml'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test the project in this repository ###
  tests:
    name: "Build/test example project code"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Build/test node example project 🛠️"
        shell: bash
        run: |
          # Build/test node example project
          echo "Building/testing example project"
          node -v
          npm install
          npm test

      - name: "Lint, format check and type check 🔍"
        shell: bash
        run: |
          # Lint, format check and type check
          npm run lint
          npm run format:check
          npm run typecheck

      - name: "Write JUnit and coverage reports 📊"
        shell: bash
        run: |
          # Write JUnit and coverage reports
          npm run test:ci
          for report in reports/junit.xml coverage/lcov.info \
            coverage/coverage-summary.json; do
            if [ ! -s "$report" ]; then
              echo "Error: test:ci did not write $report ❌"
              exit 1
            fi
          done
